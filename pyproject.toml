[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stereo1d"
version = "0.1.0"
description = "Baseline PyTorch pipeline for the Disp1DNet 1D-CNN stereo disparity model"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.5.1",
    "numpy>=1.26.4",
    "scikit-image>=0.19",
    "imageio>=2.19",
    "matplotlib>=3.5",
    "scikit-learn>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
